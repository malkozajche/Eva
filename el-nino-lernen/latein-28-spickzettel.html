<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spickzettel Lektion 28 · Nero (dünn · Buchtext)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Helvetica Neue", Arial, Helvetica, sans-serif; background: #dfe6ea; color: #111; }
    .bar {
      position: sticky; top: 0; z-index: 5;
      display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; align-items: center;
      padding: 0.7rem 1rem; background: #1a4a6a; color: #fff;
      font-family: system-ui, sans-serif; font-size: 0.92rem;
    }
    .bar button, .bar a {
      font: inherit; font-weight: 700; border: none; cursor: pointer;
      border-radius: 999px; padding: 0.4rem 0.9rem; text-decoration: none;
      background: #fff; color: #1a4a6a;
    }
    .bar .ghost { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,0.55); }
    .hint-screen {
      max-width: 780px; margin: 0.75rem auto; padding: 0 1rem;
      font-family: system-ui, sans-serif; font-size: 0.9rem; font-weight: 600;
      text-align: center; color: #333; line-height: 1.4;
    }

    .sheet {
      width: 210mm;
      min-height: 297mm;
      margin: 0.7rem auto 1.4rem;
      background: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      padding: 0;
      position: relative;
      display: flex;
      overflow: hidden;
    }
    .cut {
      position: absolute; top: 0; bottom: 0; width: 0;
      border-left: 1px dashed #b8b8b8; pointer-events: none; z-index: 2;
    }
    .cut.c1 { left: 33.333%; }
    .cut.c2 { left: 66.666%; }
    .cut-label {
      position: absolute; top: 1.5mm; z-index: 3;
      font-size: 5.5pt; color: #999; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em;
      pointer-events: none; transform: translateX(-50%);
      background: #fff; padding: 0 1mm;
    }
    .cut-label.l1 { left: 33.333%; }
    .cut-label.l2 { left: 66.666%; }

    .strip {
      width: 33.333%;
      height: 297mm;
      padding: 4mm 2.8mm 3.5mm;
      overflow: hidden;
      border-right: none;
    }
    .strip-title {
      font-size: 7pt; font-weight: 800; text-align: center; line-height: 1.15; margin-bottom: 0.3mm;
    }
    .strip-sub {
      font-size: 5pt; text-align: center; color: #555; font-weight: 700; margin-bottom: 1.2mm;
    }
    .sec {
      font-size: 5.4pt; font-weight: 800; background: #1a4a6a; color: #fff;
      padding: 0.5mm 1mm; margin: 1mm 0 0.55mm; border-radius: 1mm;
      letter-spacing: 0.02em;
    }
    table.v {
      width: 100%;
      border-collapse: collapse;
      font-size: 5pt;
      line-height: 1.14;
    }
    table.v td {
      vertical-align: top;
      padding: 0.35mm 0.4mm 0.35mm 0;
      border-bottom: 0.2pt solid #ececec;
    }
    table.v td.la {
      font-family: "Times New Roman", "Liberation Serif", Georgia, serif;
      font-weight: 700;
      width: 38%;
      padding-right: 0.6mm;
    }
    table.v td.la .sf {
      display: block;
      font-weight: 400;
      font-size: 4.4pt;
      color: #333;
      line-height: 1.1;
      margin-top: 0.1mm;
    }
    table.v td.de { width: 62%; }
    .note {
      font-size: 4.4pt; color: #333; margin-top: 0.7mm; line-height: 1.15;
      padding: 0.55mm 0.7mm; background: #f4f7f9; border-left: 1pt solid #1a4a6a;
    }
    .note strong { font-weight: 800; }
    .warn {
      font-size: 4.4pt; color: #7a1515; margin-top: 0.5mm; line-height: 1.15;
      padding: 0.5mm 0.7mm; background: #fff3f0; border-left: 1pt solid #a33;
      font-weight: 700;
    }

    @media print {
      body { background: #fff; }
      .bar, .hint-screen { display: none !important; }
      .sheet { margin: 0; box-shadow: none; width: auto; min-height: auto; }
      @page { size: A4 portrait; margin: 0; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <strong>Spickzettel · 3 dünne Streifen</strong>
    <button type="button" onclick="window.print()">🖨️ Drucken / PDF</button>
    <a href="latein-28.html">← Lernen</a>
    <a class="ghost" href="index.html">Akademie</a>
  </div>
  <p class="hint-screen">
    A4 drucken → <strong>entlang der Linien in 3 lange Streifen schneiden</strong> → ein Streifen passt in die Hand.<br />
    Nur Lektionsvokabeln (keine Wiederholung) · Text wie im Buch · nach Wortarten sortiert.
  </p>

  <main class="sheet" id="sheet"></main>

  <script>
    /* Lektion 28 only — no Wiederholung (not in the test). Exact Pontes 3 wording. */
    const SECTIONS = [
      {
        h: "Personen",
        rows: [
          ["Nerō", "Nerōnis m.", "Nero"],
          ["Apollō", "Apollinis m.", "Apoll"],
        ],
      },
      {
        h: "Nomen",
        rows: [
          ["certāmen", "certāminis n.", "Wettkampf, Wettstreit"],
          ["iūdex", "iūdicis m.", "Richter"],
          ["rēs pūblica", "reī pūblicae f.", "Staat, Gemeinwesen"],
          ["oppidum", "oppidī n.", "(Land-) Stadt"],
        ],
      },
      {
        h: "Verben",
        rows: [
          ["praestāre", "praestō, praestitī, -", "sich hervortun, sich auszeichnen, besser sein; zeigen, erweisen; + Dat.: jdn. überragen, übertreffen"],
          ["crēdere", "crēdō, crēdidī, crēditum", "vertrauen, Glauben schenken; glauben"],
          ["dēclārāre", "dēclārō", "jdn. (öffentlich) zu etwas erklären, ausrufen"],
          ["pertinēre", "pertineō, pertinuī, -", "sich erstrecken; sich beziehen"],
          ["dīligere", "dīligō, dīlēxī, dīlēctum", "lieben, wertschätzen"],
          ["nescīre", "nesciō", "nicht wissen, nicht kennen"],
          ["scīre", "sciō", "wissen, kennen"],
          ["reprehendere", "reprehendō, reprehendī, reprehēnsum", "tadeln"],
          ["claudere", "claudō, clausī, clausum", "schließen, verschließen"],
          ["cōnsulere", "cōnsulō, cōnsuluī, cōnsultum", "sich beraten, beratschlagen"],
          ["simulāre", "simulō", "vortäuschen; so tun, als ob"],
          ["dubitāre", "dubitō", "zögern"],
          ["dēportāre", "dēportō", "wegtragen, fortschaffen"],
          ["ēvenīre", "ēveniō, ēvēnī, ēventum", "sich ereignen"],
          ["parere", "pariō, peperī, partum", "hervorbringen, gebären"],
          ["concēdere", "concēdō, concessī, concessum", "erlauben, zugestehen"],
          ["offendere", "offendō, offendī, offēnsum", "beleidigen"],
        ],
      },
      {
        h: "Adj. / Adv. / Wendungen",
        rows: [
          ["etiam", "Konj.", "auch, sogar"],
          ["meritō", "Adv.", "mit Recht, aus gutem Grund"],
          ["pūblicus", "-a, -um", "öffentlich"],
          ["necesse est", "", "es ist nötig, man muss"],
          ["quōmodo?", "", "wie?, auf welche Weise?"],
          ["clam", "Adv.", "heimlich"],
          ["altus", "-a, -um", "1. hoch; 2. tief"],
          ["tamquam", "Adv.", "wie, als ob"],
          ["quīn etiam", "", "ja sogar, ja vielmehr"],
        ],
      },
    ];

    function rows(list) {
      return list.map(([la, sf, de]) => {
        const forms = sf ? `<span class="sf">${sf}</span>` : "";
        return `<tr><td class="la">${la}${forms}</td><td class="de">${de}</td></tr>`;
      }).join("");
    }

    function stripHTML() {
      let html = `
        <div class="strip-title">Lekt. 28 · Nero</div>
        <div class="strip-sub">Künstler oder Kaiser? · Hand-Streifen</div>
      `;
      for (const s of SECTIONS) {
        html += `<div class="sec">${s.h}</div><table class="v">${rows(s.rows)}</table>`;
      }
      html += `
        <div class="note"><strong>in pūblicō:</strong> in der Öffentlichkeit</div>
        <div class="note"><strong>pertinēre ad</strong> + Akk.: sich beziehen auf</div>
        <div class="warn">Vorsicht! <strong>pārēre</strong> (gehorchen) ≠ <strong>parere</strong> (hervorbringen, gebären).</div>
      `;
      return html;
    }

    document.getElementById("sheet").innerHTML = `
      <div class="cut c1" aria-hidden="true"></div>
      <div class="cut c2" aria-hidden="true"></div>
      <span class="cut-label l1">schneiden</span>
      <span class="cut-label l2">schneiden</span>
      <div class="strip">${stripHTML()}</div>
      <div class="strip">${stripHTML()}</div>
      <div class="strip">${stripHTML()}</div>
    `;
  </script>
</body>
</html>
